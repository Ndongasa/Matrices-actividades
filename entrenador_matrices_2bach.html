<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrenador de matrices · 2.º Bachillerato</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17263b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:930px;margin:auto;padding:22px}header{background:linear-gradient(120deg,#173f77,#176f83);color:white;padding:28px;border-radius:18px}h1{margin:0 0 8px;font-size:clamp(1.5rem,4vw,2.3rem)}header p{margin:0;opacity:.95}.panel{background:white;border:1px solid #dce4ed;border-radius:16px;padding:22px;margin-top:18px;box-shadow:0 4px 15px #1c36510a}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:block;font-weight:650;margin-bottom:5px}select,button,input{font:inherit}select,input{border:1px solid #aab9c9;border-radius:8px;padding:10px;background:white;color:#17263b}button{border:0;border-radius:9px;padding:11px 16px;background:#175c91;color:white;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.1)}button.secondary{background:#e5edf5;color:#153d65}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffba46;outline-offset:2px}.stats{display:flex;flex-wrap:wrap;gap:15px;margin-top:15px;color:#3d536a}.question{font-size:1.1rem;line-height:1.6}.mathline{display:flex;align-items:center;flex-wrap:wrap;gap:13px;margin:16px 0}.matrix{display:inline-grid;position:relative;gap:7px 15px;padding:9px 15px;vertical-align:middle;text-align:center;font-variant-numeric:tabular-nums}.matrix:before,.matrix:after{content:"";position:absolute;top:0;bottom:0;width:7px;border-top:2px solid;border-bottom:2px solid}.matrix:before{left:0;border-left:2px solid}.matrix:after{right:0;border-right:2px solid}.matrix span{min-width:25px}.answer-matrix input{width:64px;text-align:center;padding:8px 3px}.answer-matrix{gap:6px 8px}.answer-matrix input{max-width:15vw}.answer-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.answer-row input{width:130px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.feedback{padding:13px 16px;border-radius:9px;margin-top:15px;line-height:1.6}.good{background:#e5f6ed;border:1px solid #8dceb0}.bad{background:#fff0e5;border:1px solid #e6b389}.info{background:#eaf2ff;border:1px solid #a4c0e8}.steps{line-height:1.75}.steps p{margin:8px 0}.steps .mathline{margin:9px 0}.muted{color:#53667a;font-size:.93rem}footer{font-size:.88rem;color:#53667a;margin:20px 0}@media(max-width:550px){.wrap{padding:10px}.panel{padding:15px}.answer-matrix input{width:46px}.matrix{gap:5px 7px;padding:8px 12px}}
</style></head><body><main class="wrap"><header><h1>🧮 Entrenador de matrices</h1><p>2.º de Bachillerato · Practica a tu ritmo con corrección inmediata</p></header>
<section class="panel"><div class="toolbar"><div><label for="topic">Contenido</label><select id="topic"><option value="sum">Suma y resta</option><option value="scalar">Producto por un número</option><option value="product">Producto de matrices</option><option value="det2">Determinante 2×2</option><option value="det3">Determinante 3×3</option><option value="inverse">Matriz inversa 2×2</option><option value="rank">Rango de matrices</option></select></div><div><label for="difficulty">Dificultad</label><select id="difficulty"><option value="easy">Básica</option><option value="medium">Media</option><option value="hard">Avanzada</option></select></div><button id="new">Nuevo ejercicio ↻</button></div><div class="stats"><span>Intentos: <strong id="attempts">0</strong></span><span>Aciertos: <strong id="hits">0</strong></span><span>Ejercicios completados: <strong id="completed">0</strong></span></div></section>
<section class="panel" aria-live="polite"><div id="question" class="question"></div><div id="answer"></div><div class="actions"><button id="check">Comprobar respuesta</button><button class="secondary" id="hint">Ver pista</button><button class="secondary" id="solution">Ver solución explicada</button></div><div id="feedback" aria-live="polite"></div><div id="explanation" class="steps"></div></section><footer>Práctica individual. Las respuestas y puntuaciones no se envían ni guardan en Moodle. Puedes reiniciar el ejercicio o cambiar de contenido cuando quieras.</footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id), ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const range=()=>{let d=$('difficulty').value;return d==='easy'?3:d==='medium'?5:8};
const mat=(r,c,lim=range())=>Array.from({length:r},()=>Array.from({length:c},()=>ri(-lim,lim)));
const multiply=(a,b)=>a.map(row=>b[0].map((_,j)=>row.reduce((s,v,k)=>s+v*b[k][j],0)));
const det2=a=>a[0][0]*a[1][1]-a[0][1]*a[1][0];
const det3=a=>a[0][0]*(a[1][1]*a[2][2]-a[1][2]*a[2][1])-a[0][1]*(a[1][0]*a[2][2]-a[1][2]*a[2][0])+a[0][2]*(a[1][0]*a[2][1]-a[1][1]*a[2][0]);
const rank=a=>{let m=a.map(r=>r.slice()),p=0;for(let j=0;j<m[0].length&&p<m.length;j++){let k=p;while(k<m.length&&Math.abs(m[k][j])<1e-8)k++;if(k===m.length)continue;[m[p],m[k]]=[m[k],m[p]];let v=m[p][j];for(let x=j;x<m[0].length;x++)m[p][x]/=v;for(let i=p+1;i<m.length;i++){let f=m[i][j];for(let x=j;x<m[0].length;x++)m[i][x]-=f*m[p][x]}p++}return p};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const showMat=(a,inputs=false)=>'<span class="matrix '+(inputs?'answer-matrix':'')+'" style="grid-template-columns:repeat('+a[0].length+',auto)" '+(inputs?'role="group" aria-label="Elementos de la matriz respuesta"':'')+'>'+a.map((row,i)=>row.map((v,j)=>inputs?'<input type="text" inputmode="decimal" aria-label="Fila '+(i+1)+' columna '+(j+1)+'" data-cell="'+i+','+j+'" placeholder="?">':'<span>'+esc(v)+'</span>').join('')).join('')+'</span>';
const fmt=x=>Number.isInteger(x)?String(x):String(Number(x.toFixed(6)));
const matrixText=a=>showMat(a.map(r=>r.map(fmt)));
let ex=null,attempts=0,hits=0,completed=0,solved=false;
function generate(){let type=$('topic').value,lim=range(),A,B,C,k,answer,hint,steps,prompt,kind='matrix';
if(type==='sum'){A=mat(2,2);B=mat(2,2);let s=ri(0,1)?1:-1;answer=A.map((row,i)=>row.map((v,j)=>v+s*B[i][j]));prompt='Calcula la '+(s===1?'suma':'resta')+' de matrices:<div class="mathline">'+showMat(A)+' <strong>'+(s===1?'+':'−')+'</strong> '+showMat(B)+'</div>';hint='Opera elemento a elemento, siempre en la misma posición.';steps='Cada entrada se obtiene operando los elementos correspondientes. Por ejemplo, la posición (1,1): '+A[0][0]+(s===1?' + ':' − (' )+(s===1?B[0][0]:B[0][0]+')')+' = '+answer[0][0]+'.';}
else if(type==='scalar'){A=mat(2,3);k=ri(-4,4)||2;answer=A.map(r=>r.map(v=>k*v));prompt='Multiplica la matriz por el escalar:<div class="mathline"><strong>'+k+' ·</strong> '+showMat(A)+'</div>';hint='Multiplica cada elemento de la matriz por '+k+'.';steps='Cada elemento se multiplica por '+k+'. Ejemplo: '+k+' · ('+A[0][0]+') = '+answer[0][0]+'.';}
else if(type==='product'){let n=$('difficulty').value==='easy'?2:3;A=mat(2,n);B=mat(n,2);answer=multiply(A,B);prompt='Calcula el producto A · B (filas por columnas):<div class="mathline">'+showMat(A)+' <strong>·</strong> '+showMat(B)+'</div>';hint='La entrada (i,j) es el producto escalar de la fila i de A por la columna j de B.';steps='La entrada (1,1) se calcula como '+A[0].map((v,i)=>'('+v+' · '+B[i][0]+')').join(' + ')+' = '+answer[0][0]+'. Repite con las demás filas y columnas.';}
else if(type==='det2'){A=mat(2,2);answer=det2(A);kind='number';prompt='Calcula el determinante:<div class="mathline">'+showMat(A)+'</div>';hint='Para una matriz [[a,b],[c,d]], det = ad − bc.';steps='det(A) = ('+A[0][0]+' · '+A[1][1]+') − ('+A[0][1]+' · '+A[1][0]+') = '+answer+'.';}
else if(type==='det3'){A=mat(3,3);answer=det3(A);kind='number';prompt='Calcula el determinante de orden 3:<div class="mathline">'+showMat(A)+'</div>';hint='Desarrolla por la primera fila o utiliza la regla de Sarrus.';let m1=det2([[A[1][1],A[1][2]],[A[2][1],A[2][2]]]),m2=det2([[A[1][0],A[1][2]],[A[2][0],A[2][2]]]),m3=det2([[A[1][0],A[1][1]],[A[2][0],A[2][1]]]);steps='Desarrollo por la primera fila:<p>det(A) = '+A[0][0]+' · ('+m1+') − ('+A[0][1]+') · ('+m2+') + ('+A[0][2]+') · ('+m3+') = <strong>'+answer+'</strong>.</p>';}
else if(type==='inverse'){let d;do{A=mat(2,2);d=det2(A)}while(d===0||Math.abs(d)>($('difficulty').value==='easy'?5:25));answer=[[A[1][1]/d,-A[0][1]/d],[-A[1][0]/d,A[0][0]/d]];prompt='Calcula la matriz inversa A⁻¹:<div class="mathline">A = '+showMat(A)+'</div><p class="muted">Puedes introducir fracciones como 2/3 o -1/4, y también decimales.</p>';hint='Primero calcula det(A). Después A⁻¹ = (1/det A) · [[d,−b],[−c,a]].';steps='det(A) = '+d+' ≠ 0, así que existe inversa.<p>A⁻¹ = (1/'+d+') · '+showMat([[A[1][1],-A[0][1]],[-A[1][0],A[0][0]]])+'.</p>';}
else {let n=$('difficulty').value==='easy'?2:3;A=mat(n,n);if(ri(0,1)===0){let from=ri(0,n-2),to=n-1,f=ri(-2,2);A[to]=A[from].map(v=>v*f)}answer=rank(A);kind='number';prompt='Calcula el rango de la matriz:<div class="mathline">'+showMat(A)+'</div>';hint='Aplica eliminación de Gauss. El rango es el número de filas no nulas que quedan en forma escalonada.';let d=n===2?det2(A):det3(A);steps='Mediante eliminación de Gauss se obtiene un total de <strong>'+answer+' pivote(s)</strong>, por lo que el rango es '+answer+'.'+(d!==0?' Además, det(A) = '+d+' ≠ 0, por lo que tiene rango máximo.':' Como det(A) = 0, el rango no es máximo; se distinguen '+answer+' filas linealmente independientes.');}
return {type,prompt,answer,kind,hint,steps};}
function newExercise(){ex=generate();solved=false;$('question').innerHTML='<h2>Ejercicio</h2>'+ex.prompt;$('answer').innerHTML='<label>Tu respuesta:</label>'+(ex.kind==='matrix'?showMat(ex.answer,true):'<div class="answer-row"><input id="numeric" inputmode="decimal" type="text" placeholder="Escribe un número" aria-label="Respuesta numérica"></div>');$('feedback').innerHTML='';$('explanation').innerHTML='';$('check').disabled=false;}
function parseNumber(s){s=String(s).trim().replace(',','.');if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:\s*\/\s*[+-]?(?:\d+(?:\.\d*)?|\.\d+))?$/.test(s))return NaN;let z=s.split('/').map(Number);return z.length===2&&z[1]!==0?z[0]/z[1]:z.length===1?z[0]:NaN;}
function check(){let vals=ex.kind==='matrix'?[...document.querySelectorAll('[data-cell]')].map(x=>parseNumber(x.value)):[parseNumber($('numeric').value)];if(vals.some(v=>!Number.isFinite(v))){$('feedback').innerHTML='<div class="feedback bad">Introduce todos los valores. Se admiten enteros, decimales y fracciones como -3/2.</div>';return;}let expected=ex.kind==='matrix'?ex.answer.flat():[ex.answer];let correct=vals.every((v,i)=>Math.abs(v-expected[i])<1e-5);attempts++;if(correct&&!solved){hits++;completed++;solved=true;$('check').disabled=true}if(!correct&&!solved){}$('attempts').textContent=attempts;$('hits').textContent=hits;$('completed').textContent=completed;$('feedback').innerHTML='<div class="feedback '+(correct?'good':'bad')+'">'+(correct?'✓ ¡Correcto! Muy bien.':'✗ Todavía no es correcto. Revisa tus cálculos o consulta una pista.')+'</div>';}
function explain(){let value=ex.kind==='matrix'?matrixText(ex.answer):'<strong>'+fmt(ex.answer)+'</strong>';$('explanation').innerHTML='<div class="feedback info"><strong>Solución:</strong><div class="mathline">'+value+'</div><strong>Explicación:</strong><div>'+ex.steps+'</div></div>';if(!solved){solved=true;completed++;$('completed').textContent=completed;$('check').disabled=true;}}
$('new').addEventListener('click',newExercise);$('topic').addEventListener('change',newExercise);$('difficulty').addEventListener('change',newExercise);$('check').addEventListener('click',check);$('hint').addEventListener('click',()=>{$('feedback').innerHTML='<div class="feedback info"><strong>Pista:</strong> '+ex.hint+'</div>'});$('solution').addEventListener('click',explain);newExercise();
</script></body></html>
